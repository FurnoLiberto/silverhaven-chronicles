<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Silverhaven Chronicles</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <!-- LEFT PANEL: STATS -->
    <div class="panel" id="left-panel">
        <div class="header">Character</div>
        <div id="stats-container"></div>
        <div class="header" style="margin-top: 20px;">Skills</div>
        <div id="skills-container"></div>
    </div>

    <!-- CENTER PANEL: GAME LOG & VIEWS -->
    <div class="panel" id="center-panel">
        <div class="header" id="clock-display">Day 1 - 08:00</div>
        
        <!-- EXPLORATION VIEW (Visible by default) -->
        <div id="exploration-view">
            <div class="location-tag" id="location-display">Location: Silverhaven</div>
            <div id="game-log"></div>
        </div>

        <!-- COMBAT VIEW (Hidden by default) -->
        <div id="combat-view" style="display:none;">
            <div class="combat-header">COMBAT ENCOUNTER</div>
            
            <div class="enemy-display">
                <h3 id="enemy-name">Goblin</h3>
                <div class="stat-row">
                    <span>HP:</span>
                    <span id="enemy-hp">50/50</span>
                </div>
                <div class="progress-bar"><div id="enemy-hp-bar" class="progress-fill" style="width: 100%; background: #d32f2f;"></div></div>
            </div>

            <div id="combat-log" class="log-box"></div>

            <div class="combat-controls">
                <button onclick="combatManager.playerAction('attack')">⚔️ Physical Attack</button>
                <button onclick="combatManager.playerAction('spell')">🔥 Firebolt (5 MP)</button>
                <button onclick="combatManager.playerAction('defend')">🛡️ Defend</button>
                <button onclick="combatManager.playerAction('flee')">🏃 Flee</button>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL: ACTIONS & INVENTORY -->
    <div class="panel" id="right-panel">
        <div class="header">Actions</div>
        <div id="actions-container"></div> <!-- Exploration Buttons -->
        <div class="header" style="margin-top: 20px;">Inventory</div>
        <div id="inventory-container">Empty</div>
    </div>
</div>

<!-- LOAD SCRIPTS IN ORDER -->
<script src="js/data.js"></script>
<script src="js/classes.js"></script>
<script src="js/ui.js"></script>
<script src="js/combat.js"></script>
<script src="js/main.js"></script>

</body>
</html>
